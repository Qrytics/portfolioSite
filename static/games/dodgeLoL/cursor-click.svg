<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Soft cyan glow behind the crystal -->
  <circle cx="20" cy="20" r="11" fill="#38bdf8" opacity="0.55" filter="url(#blur)"/>
  <!-- Outer diamond kite shape -->
  <polygon points="20,2 38,20 20,38 2,20" fill="url(#outer)"/>
  <!-- Inner glowing crystal -->
  <polygon points="20,8 34,20 20,32 6,20" fill="url(#innerGlow)"/>
  <!-- Tiny center highlight -->
  <polygon points="20,13 27,20 20,27 13,20" fill="#f5feff" stroke="#eafcff" stroke-width="0.5"/>
</svg>
