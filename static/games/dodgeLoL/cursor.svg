<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="30%" stop-color="#f5d77f"/>
      <stop offset="65%" stop-color="#c69532"/>
      <stop offset="100%" stop-color="#6e4f13"/>
    </linearGradient>
    <linearGradient id="coreMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3342"/>
      <stop offset="50%" stop-color="#151b26"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Sleek arrowhead without tail stem (League pointer) -->
  <polygon points="2,2 24,15 14,16 9,25" fill="url(#goldOuter)" filter="url(#shadow)"/>
  <polygon points="4,5 20,14 13,15 9,22" fill="url(#coreMetal)"/>
  <circle cx="10.5" cy="12.5" r="1.8" fill="url(#gem)"/>
</svg>
