<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b0e17" />
      <stop offset="50%" stopColor="#141829" />
      <stop offset="100%" stopColor="#080a10" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFD54F" />
      <stop offset="50%" stopColor="#FFC107" />
      <stop offset="100%" stopColor="#FFA000" />
    </linearGradient>
    <radialGradient id="boxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFD700" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#FFD700" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="beamGrey" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#9E9E9E" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#9E9E9E" stopOpacity="0" />
    </linearGradient>
    <linearGradient id="beamBlue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#00B0FF" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#00B0FF" stopOpacity="0" />
    </linearGradient>
    <linearGradient id="beamOrange" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#FF9100" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#FF9100" stopOpacity="0" />
    </linearGradient>
    <linearGradient id="beamRed" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#FF1744" stopOpacity="0.95" />
      <stop offset="100%" stopColor="#FF1744" stopOpacity="0" />
    </linearGradient>
    <linearGradient id="beamYellow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#FFD700" stopOpacity="1" />
      <stop offset="100%" stopColor="#FFD700" stopOpacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Ambient floor grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="390" x2="800" y2="390" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <line x1="100" y1="340" x2="0" y2="450" />
    <line x1="250" y1="340" x2="150" y2="450" />
    <line x1="400" y1="340" x2="400" y2="450" />
    <line x1="550" y1="340" x2="650" y2="450" />
    <line x1="700" y1="340" x2="800" y2="450" />
  </g>

  <!-- 5 Rarity Light Beams Bursting Upward -->
  <polygon points="350,340 370,340 300,50 260,50" fill="url(#beamGrey)" />
  <polygon points="370,340 390,340 350,30 320,30" fill="url(#beamBlue)" filter="url(#glow)" />
  <polygon points="390,340 410,340 410,20 390,20" fill="url(#beamOrange)" filter="url(#glow)" />
  <polygon points="410,340 430,340 480,30 450,30" fill="url(#beamRed)" filter="url(#glow)" />
  <polygon points="430,340 450,340 540,50 500,50" fill="url(#beamYellow)" filter="url(#glow)" />

  <!-- Pedestal Glow -->
  <ellipse cx="400" cy="350" rx="200" ry="40" fill="url(#boxGlow)" />
  <ellipse cx="400" cy="350" rx="140" ry="25" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6" />

  <!-- Center Lootbox 3D Geometry -->
  <g transform="translate(400, 290)">
    <!-- Main Box Body -->
    <rect x="-80" y="-70" width="160" height="120" rx="16" fill="#2d3748" stroke="#FFD700" stroke-width="4" filter="url(#glow)" />
    <rect x="-65" y="-55" width="130" height="90" rx="10" fill="#1a202c" stroke="#4a5568" stroke-width="2" />
    
    <!-- Center Emblem -->
    <circle cx="0" cy="-10" r="32" fill="#2d3748" stroke="#FFD700" stroke-width="3" />
    <text x="0" y="2" font-family="'Orbitron', sans-serif" font-weight="900" font-size="28" fill="#FFD700" text-anchor="middle">★</text>
    
    <!-- Top & Side Clamps -->
    <rect x="-35" y="-78" width="70" height="12" rx="4" fill="#FFD700" stroke="#FFF" stroke-width="1.5" />
    <rect x="-90" y="-20" width="14" height="40" rx="3" fill="#FFD700" />
    <rect x="76" y="-20" width="14" height="40" rx="3" fill="#FFD700" />
  </g>

  <!-- Title & Typography -->
  <text x="400" y="85" font-family="'Orbitron', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    CASE<tspan fill="url(#goldText)">GAMBA</tspan>
  </text>
  <text x="400" y="125" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="20" fill="#94A3B8" text-anchor="middle" letter-spacing="3">
    OVERWATCH-STYLE LOOTBOX UNBOXER
  </text>

  <!-- Feature Badges -->
  <g transform="translate(400, 415)" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" fill="#CBD5E1" text-anchor="middle">
    <text x="-220" y="0">📦 10 CRATE TIERS</text>
    <text x="0" y="0">👤 1,000 FIGURE VARIANTS &amp; AVATAR</text>
    <text x="220" y="0">🦘 DOODLE JUMP MINIGAME</text>
  </g>
</svg>
